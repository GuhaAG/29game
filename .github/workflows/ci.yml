name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck server and browser bundle
        run: npm run typecheck

      - run: npm run build

      # Engine fixtures, jsdom screen tests, and four real clients over HTTP and
      # WebSocket against the real server. No services to provision.
      - name: Test
        run: npm test
